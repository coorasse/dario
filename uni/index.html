<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Uni</title>
<style>
  :root {
    --sky-top: #ffafcc;
    --sky-bottom: #cdb4db;
    --text: #2b2b52;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    font-family: "Comic Sans MS", "Chalkboard SE", system-ui, sans-serif;
    background: linear-gradient(var(--sky-top), var(--sky-bottom));
    color: var(--text);
    user-select: none;
    touch-action: none;
  }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    text-align: center;
  }
  #home {
    position: fixed;
    top: 12px;
    left: 12px;
    font-size: 30px;
    line-height: 1;
    padding: 8px 14px;
    border-radius: 40px;
    background: #fff;
    box-shadow: 0 4px 0 #0004;
    text-decoration: none;
  }
  .icon {
    font-size: min(45vw, 220px);
    line-height: 1;
    animation: bounce 0.8s ease-in-out infinite alternate;
  }
  h1 { margin: 0; font-size: 56px; }
  p { margin: 0; font-size: 28px; }
  @keyframes bounce {
    from { transform: translateY(0) rotate(-6deg); }
    to { transform: translateY(-30px) rotate(6deg); }
  }
</style>
</head>
<body>
<a id="home" href="../" aria-label="Torna ai giochi">🏠</a>
<div class="icon">🦄</div>
<h1>Uni</h1>
<p>Arriva presto! 🚧</p>
</body>
</html>
