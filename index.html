<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Il Gioco di Pietro</title>
<style>
  :root {
    --space-top: #0b0b2e;
    --space-bottom: #2a1b5c;
    --ground: #8a5cc7;
    --text: #2b2b52;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    font-family: "Comic Sans MS", "Chalkboard SE", system-ui, sans-serif;
    background: linear-gradient(var(--space-top), var(--space-bottom));
    user-select: none;
    touch-action: none;
  }
  canvas { display: block; width: 100vw; height: 100vh; cursor: none; }
  #remaining {
    position: fixed;
    top: 12px;
    left: 50%;
    translate: -50% 0;
    background: #fff;
    color: var(--text);
    font-size: 30px;
    padding: 4px 20px;
    border-radius: 40px;
    box-shadow: 0 4px 0 #0004;
    white-space: nowrap;
  }
  #trophies {
    position: fixed;
    top: 12px;
    right: 12px;
    background: #ffd60a;
    color: var(--text);
    font-size: 30px;
    font-weight: bold;
    padding: 4px 18px;
    border-radius: 40px;
    box-shadow: 0 4px 0 #b38f00;
    max-width: 30vw;
    text-align: right;
    word-break: break-all;

    &:empty { display: none; }
  }
  #win {
    position: fixed;
    inset: 0;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 20px;
    background: #0008;
    color: #fff;
    text-align: center;

    &.show { display: flex; }

    .trophy {
      font-size: min(45vw, 260px);
      line-height: 1;
      animation: bounce 0.8s ease-in-out infinite alternate;
    }

    h1 { margin: 0; font-size: 48px; color: #ffd60a; text-shadow: 0 4px 0 #0006; }

    button {
      font: inherit;
      font-size: 36px;
      padding: 12px 40px;
      border: none;
      border-radius: 50px;
      background: #2ec4b6;
      color: #fff;
      box-shadow: 0 6px 0 #1a7a71;
      cursor: pointer;
    }
  }
  @keyframes bounce {
    from { transform: translateY(0) rotate(-6deg); }
    to { transform: translateY(-30px) rotate(6deg); }
  }
</style>
</head>
<body>
<div id="remaining"></div>
<div id="trophies"></div>
<canvas id="game"></canvas>
<div id="win">
  <div class="trophy">🏆</div>
  <h1>Hai vinto!</h1>
  <button id="again">Ancora! 🚀</button>
</div>
<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const remainingEl = document.getElementById("remaining");
const winEl = document.getElementById("win");
const trophiesEl = document.getElementById("trophies");

let trophies = 0;
try { trophies = Number(localStorage.getItem("trophies")) || 0; } catch {}

function addTrophy() {
  trophies++;
  try { localStorage.setItem("trophies", trophies); } catch {}
}

function showTrophies() {
  trophiesEl.textContent = "🏆".repeat(trophies);
}

const BIG_ALIENS = 5;
const GROUND = 70;
const COLORS = ["#7ae582", "#4cc9f0", "#f72585", "#ffb703", "#b388ff"];

let aliens, particles, beams, sucked, won, aim;
let pointer = { x: innerWidth / 2, y: innerHeight / 2 };
let stars = [];
let audio;

function rand(min, max) { return min + Math.random() * (max - min); }

function resize() {
  canvas.width = innerWidth * devicePixelRatio;
  canvas.height = innerHeight * devicePixelRatio;
  ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
  stars = Array.from({ length: 120 }, () => ({
    x: rand(0, innerWidth), y: rand(0, innerHeight - GROUND), r: rand(0.5, 2), p: rand(0, 6),
  }));
}
addEventListener("resize", resize);
resize();

function hero() {
  return { x: innerWidth / 2, y: innerHeight - GROUND + 10 };
}

function makeAlien(big, x, y, parent, color) {
  const r = big ? rand(48, 60) : 30;
  return {
    big, parent, r, x, y, color,
    vx: rand(-1.5, 1.5) || 1,
    vy: rand(-1.5, 1.5) || 1,
    born: performance.now(),
    wobble: rand(0, 6),
    alpha: 1,
    invisibleUntil: 0,
    nextHide: performance.now() + rand(3000, 8000),
  };
}

function start() {
  aliens = [];
  particles = [];
  beams = [];
  sucked = [];
  won = false;
  aim = -Math.PI / 2;
  winEl.classList.remove("show");
  showTrophies();
  for (let i = 0; i < BIG_ALIENS; i++) {
    const r = 60;
    aliens.push(makeAlien(true, rand(r, innerWidth - r), rand(r + 80, innerHeight - GROUND - r - 120), i,
      COLORS[i % COLORS.length]));
  }
  updateRemaining();
}

function remainingCount() {
  const parents = new Set();
  for (const a of [...aliens, ...sucked]) parents.add(a.parent);
  return parents.size;
}

function updateRemaining() {
  const n = remainingCount();
  remainingEl.textContent = n ? "👽".repeat(n) : "🏆";
}

function drawAlien(a, t) {
  const grow = Math.max(0, Math.min(1, (t - a.born) / 300));
  const r = a.r * grow * (a.scale ?? 1);
  const squish = 1 + Math.sin(t / 180 + a.wobble) * 0.07;
  ctx.save();
  ctx.globalAlpha = a.alpha;
  ctx.translate(a.x, a.y);
  if (a.spin) ctx.rotate(a.spin);
  ctx.scale(squish, 1 / squish);

  ctx.strokeStyle = a.color;
  ctx.lineWidth = r * 0.1;
  for (const side of [-1, 1]) {
    ctx.beginPath();
    ctx.moveTo(side * r * 0.3, -r * 0.8);
    ctx.lineTo(side * r * 0.55, -r * 1.35);
    ctx.stroke();
    ctx.fillStyle = "#ffd60a";
    ctx.beginPath();
    ctx.arc(side * r * 0.55, -r * 1.4, r * 0.13, 0, Math.PI * 2);
    ctx.fill();
  }

  ctx.fillStyle = a.color;
  ctx.beginPath();
  ctx.ellipse(0, 0, r, r * 0.9, 0, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = "#fff";
  ctx.beginPath();
  ctx.arc(0, -r * 0.15, r * 0.38, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = "#111";
  ctx.beginPath();
  ctx.arc(Math.sin(t / 350 + a.wobble) * r * 0.12, -r * 0.12, r * 0.18, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = "#fff";
  ctx.beginPath();
  ctx.arc(Math.sin(t / 350 + a.wobble) * r * 0.12 + r * 0.06, -r * 0.18, r * 0.05, 0, Math.PI * 2);
  ctx.fill();

  ctx.strokeStyle = "#111";
  ctx.lineWidth = r * 0.07;
  ctx.beginPath();
  ctx.arc(0, r * 0.35, r * 0.25, 0.15 * Math.PI, 0.85 * Math.PI);
  ctx.stroke();

  ctx.restore();
}

function drawHero(t) {
  const { x, y } = hero();
  ctx.save();
  ctx.translate(x, y);

  ctx.save();
  ctx.rotate(aim + Math.PI / 2);
  ctx.fillStyle = "#c0c0d8";
  ctx.fillRect(-12, -75, 24, 55);
  ctx.fillStyle = "#ff5c8a";
  ctx.fillRect(-16, -82, 32, 12);
  ctx.restore();

  ctx.fillStyle = "#3a86ff";
  ctx.beginPath();
  ctx.ellipse(0, 0, 70, 30, 0, Math.PI, 0);
  ctx.fill();
  ctx.fillStyle = "#9fd8ff";
  ctx.beginPath();
  ctx.arc(0, -18, 32, Math.PI, 0);
  ctx.fill();

  ctx.fillStyle = "#ffd6a5";
  ctx.beginPath();
  ctx.arc(0, -22, 18, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = "#222";
  ctx.beginPath();
  ctx.arc(-6, -25, 3, 0, Math.PI * 2);
  ctx.arc(6, -25, 3, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = "#222";
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.arc(0, -20, 7, 0.2 * Math.PI, 0.8 * Math.PI);
  ctx.stroke();

  for (let i = -2; i <= 2; i++) {
    ctx.fillStyle = Math.floor(t / 250 + i) % 2 ? "#ffd60a" : "#fff";
    ctx.beginPath();
    ctx.arc(i * 25, -6, 5, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();
}

function gunTip() {
  const { x, y } = hero();
  return { x: x + Math.cos(aim) * 80, y: y + Math.sin(aim) * 80 };
}

function tone(type, from, to, duration, volume = 0.2) {
  audio ??= new AudioContext();
  const osc = audio.createOscillator();
  const gain = audio.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(from, audio.currentTime);
  osc.frequency.exponentialRampToValueAtTime(to, audio.currentTime + duration);
  gain.gain.setValueAtTime(volume, audio.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, audio.currentTime + duration);
  osc.connect(gain).connect(audio.destination);
  osc.start();
  osc.stop(audio.currentTime + duration);
}

function noise(duration, fromFreq, toFreq, volume = 0.5) {
  audio ??= new AudioContext();
  const len = audio.sampleRate * duration;
  const buffer = audio.createBuffer(1, len, audio.sampleRate);
  const data = buffer.getChannelData(0);
  for (let i = 0; i < len; i++) data[i] = (Math.random() * 2 - 1) * volume;
  const src = audio.createBufferSource();
  src.buffer = buffer;
  const filter = audio.createBiquadFilter();
  filter.type = "bandpass";
  filter.frequency.setValueAtTime(fromFreq, audio.currentTime);
  filter.frequency.exponentialRampToValueAtTime(toFreq, audio.currentTime + duration);
  const gain = audio.createGain();
  gain.gain.setValueAtTime(volume, audio.currentTime);
  gain.gain.linearRampToValueAtTime(0, audio.currentTime + duration);
  src.connect(filter).connect(gain).connect(audio.destination);
  src.start();
}

const sounds = {
  laser: () => tone("square", 1400, 200, 0.25, 0.12),
  boom: () => noise(0.5, 600, 80, 0.9),
  vacuum: () => noise(0.7, 300, 3000, 0.4),
  pop: () => tone("sine", 400, 1200, 0.15, 0.3),
  fanfare: () => [523, 659, 784, 1047].forEach((f, i) =>
    setTimeout(() => tone("triangle", f, f, 0.35, 0.25), i * 180)),
};

function burst(x, y, color, count = 40) {
  for (let i = 0; i < count; i++) {
    const a = rand(0, Math.PI * 2);
    const s = rand(2, 9);
    particles.push({
      x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 1, size: rand(5, 14),
      color: Math.random() < 0.4 ? "#ffd60a" : color,
    });
  }
}

function laser(x, y) {
  const tip = gunTip();
  beams.push({ x1: tip.x, y1: tip.y, x2: x, y2: y, life: 1 });
  sounds.laser();
}

function shoot(a) {
  laser(a.x, a.y);
  setTimeout(sounds.boom, 80);
  burst(a.x, a.y, a.color);
  for (const dir of [-1, 1]) {
    const kid = makeAlien(false, a.x + dir * 30, a.y, a.parent, a.color);
    kid.vx = dir * rand(2, 3);
    kid.vy = rand(-2, 2);
    kid.nextHide = performance.now() + rand(4000, 9000);
    aliens.push(kid);
  }
}

function suck(a) {
  a.scale = 1;
  a.spin = 0;
  sucked.push(a);
  sounds.vacuum();
}

function targetAt(x, y) {
  const visible = aliens.filter((a) => a.alpha >= 0.5);
  const touched = visible.find((a) => Math.hypot(x - a.x, y - a.y) < a.r * 1.3);
  if (touched) return touched;

  const tip = gunTip();
  const dx = Math.cos(aim);
  const dy = Math.sin(aim);
  let best = null;
  let bestDistance = Infinity;
  for (const a of visible) {
    const along = (a.x - tip.x) * dx + (a.y - tip.y) * dy;
    const side = Math.abs((a.x - tip.x) * dy - (a.y - tip.y) * dx);
    if (along > 0 && side < a.r * 1.2 && along < bestDistance) {
      best = a;
      bestDistance = along;
    }
  }
  return best;
}

canvas.addEventListener("pointermove", (ev) => {
  pointer = { x: ev.clientX, y: ev.clientY };
});

canvas.addEventListener("pointerdown", (ev) => {
  pointer = { x: ev.clientX, y: ev.clientY };
  if (won) return;
  const h = hero();
  aim = Math.atan2(Math.min(ev.clientY - h.y, -10), ev.clientX - h.x);
  const a = targetAt(ev.clientX, ev.clientY);
  if (!a) {
    const tip = gunTip();
    laser(tip.x + Math.cos(aim) * 3000, tip.y + Math.sin(aim) * 3000);
    return;
  }
  aliens.splice(aliens.indexOf(a), 1);
  a.big ? shoot(a) : suck(a);
});

function drawCrosshair() {
  const { x, y } = pointer;
  ctx.save();
  ctx.lineCap = "round";
  for (const [color, width] of [["#000a", 10], ["#ffd60a", 5]]) {
    ctx.strokeStyle = color;
    ctx.lineWidth = width;
    ctx.beginPath();
    ctx.arc(x, y, 30, 0, Math.PI * 2);
    ctx.moveTo(x - 48, y); ctx.lineTo(x - 14, y);
    ctx.moveTo(x + 14, y); ctx.lineTo(x + 48, y);
    ctx.moveTo(x, y - 48); ctx.lineTo(x, y - 14);
    ctx.moveTo(x, y + 14); ctx.lineTo(x, y + 48);
    ctx.stroke();
  }
  ctx.fillStyle = "#ff3b3b";
  ctx.beginPath();
  ctx.arc(x, y, 6, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

document.getElementById("again").addEventListener("click", start);

function updateInvisibility(a, t) {
  if (t > a.nextHide && a.invisibleUntil < t) {
    a.invisibleUntil = t + rand(1500, 2500);
    a.nextHide = a.invisibleUntil + rand(4000, 9000);
  }
  const target = t < a.invisibleUntil ? 0 : 1;
  a.alpha += (target - a.alpha) * 0.08;
}

function loop(t) {
  ctx.clearRect(0, 0, innerWidth, innerHeight);

  for (const s of stars) {
    ctx.globalAlpha = 0.5 + Math.sin(t / 500 + s.p) * 0.5;
    ctx.fillStyle = "#fff";
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue("--ground");
  ctx.beginPath();
  ctx.ellipse(innerWidth / 2, innerHeight + 200, innerWidth, 200 + GROUND, 0, 0, Math.PI * 2);
  ctx.fill();

  for (const a of aliens) {
    a.x += a.vx;
    a.y += a.vy;
    if (a.x < a.r) { a.x = a.r; a.vx = Math.abs(a.vx); }
    if (a.x > innerWidth - a.r) { a.x = innerWidth - a.r; a.vx = -Math.abs(a.vx); }
    if (a.y < a.r + 80) { a.y = a.r + 80; a.vy = Math.abs(a.vy); }
    if (a.y > innerHeight - GROUND - a.r - 100) { a.y = innerHeight - GROUND - a.r - 100; a.vy = -Math.abs(a.vy); }
    updateInvisibility(a, t);
    if (a.alpha < 0.5 && Math.random() < 0.05) {
      particles.push({ x: a.x + rand(-a.r, a.r), y: a.y + rand(-a.r, a.r), vx: 0, vy: -0.5, life: 0.6,
        size: 3, color: "#fff" });
    }
    drawAlien(a, t);
  }

  const tip = gunTip();
  for (const a of sucked) {
    a.x += (tip.x - a.x) * 0.08;
    a.y += (tip.y - a.y) * 0.08;
    a.scale *= 0.95;
    a.spin += 0.3;
    a.alpha = 1;
    ctx.strokeStyle = "#9fd8ff88";
    ctx.lineWidth = 3;
    for (let i = 0; i < 3; i++) {
      const off = ((t / 60 + i * 12) % 36) - 18;
      ctx.beginPath();
      ctx.moveTo(tip.x, tip.y);
      ctx.quadraticCurveTo((tip.x + a.x) / 2 + off * 2, (tip.y + a.y) / 2 - off, a.x, a.y);
      ctx.stroke();
    }
    drawAlien(a, t);
  }
  const done = sucked.filter((a) => a.scale < 0.1);
  if (done.length) {
    sucked = sucked.filter((a) => a.scale >= 0.1);
    for (const a of done) {
      sounds.pop();
      burst(tip.x, tip.y, a.color, 12);
    }
    updateRemaining();
  }

  beams = beams.filter((b) => b.life > 0);
  for (const b of beams) {
    ctx.globalAlpha = b.life;
    ctx.strokeStyle = "#ff3b3b";
    ctx.lineWidth = 12 * b.life;
    ctx.beginPath();
    ctx.moveTo(b.x1, b.y1);
    ctx.lineTo(b.x2, b.y2);
    ctx.stroke();
    ctx.strokeStyle = "#fff";
    ctx.lineWidth = 4 * b.life;
    ctx.stroke();
    b.life -= 0.08;
  }
  ctx.globalAlpha = 1;

  drawHero(t);

  particles = particles.filter((p) => p.life > 0);
  for (const p of particles) {
    p.x += p.vx;
    p.y += p.vy;
    p.vy += 0.2;
    p.life -= 0.02;
    ctx.globalAlpha = Math.max(0, p.life);
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size * Math.max(0, p.life), 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  drawCrosshair();

  if (!won && aliens.length === 0 && sucked.length === 0) {
    won = true;
    addTrophy();
    sounds.fanfare();
    setTimeout(() => winEl.classList.add("show"), 600);
  }

  requestAnimationFrame(loop);
}

start();
requestAnimationFrame(loop);
</script>
</body>
</html>
