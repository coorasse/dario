<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>I Giochi di Pietro</title>
<style>
  :root {
    --space-top: #0b0b2e;
    --space-bottom: #2a1b5c;
    --text: #2b2b52;
    --title: #ffd60a;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    min-height: 100%;
    font-family: "Comic Sans MS", "Chalkboard SE", system-ui, sans-serif;
    background: linear-gradient(var(--space-top), var(--space-bottom)) fixed;
    user-select: none;
  }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 32px;
    padding: 32px 16px;
  }
  h1 {
    margin: 0;
    font-size: clamp(36px, 8vw, 64px);
    color: var(--title);
    text-align: center;
    text-shadow: 0 4px 0 #0006;
  }
  .games {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 28px;
    width: min(100%, 960px);
  }
  .game {
    --color: #2ec4b6;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    padding: 24px 16px;
    border-radius: 36px;
    background: var(--color);
    box-shadow: 0 10px 0 color-mix(in srgb, var(--color), #000 35%);
    color: #fff;
    text-decoration: none;
    transition: translate 0.1s, box-shadow 0.1s;

    &:hover { translate: 0 -4px; }
    &:active {
      translate: 0 8px;
      box-shadow: 0 2px 0 color-mix(in srgb, var(--color), #000 35%);
    }

    .icon {
      font-size: 120px;
      line-height: 1;
      filter: drop-shadow(0 6px 0 #0003);
    }
    .name {
      font-size: 40px;
      font-weight: bold;
      text-shadow: 0 3px 0 #0004;
    }
  }
</style>
</head>
<body>
<h1>I Giochi di Pietro</h1>
<nav class="games">
  <a class="game" href="alieni/" style="--color: #7b2cbf">
    <span class="icon">👽</span>
    <span class="name">Alieni</span>
  </a>
  <a class="game" href="uni/" style="--color: #f72585">
    <span class="icon">🦄</span>
    <span class="name">Uni</span>
  </a>
</nav>
</body>
</html>
